<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 44" width="236" height="44" role="img" aria-label="EC-CUBE SHOP">
  <title>EC-CUBE SHOP</title>
  <defs>
    <!-- ブラウン管のような走査線 -->
    <pattern id="b-scan" width="4" height="3" patternUnits="userSpaceOnUse">
      <rect width="4" height="1.1" fill="#000000" opacity=".5"/>
    </pattern>
    <!-- 横一列だけ信号が飛んだように見せるための帯 -->
    <clipPath id="b-slice"><rect x="0" y="14.5" width="236" height="4.5"/></clipPath>
    <clipPath id="b-slice2"><rect x="0" y="25" width="236" height="3"/></clipPath>
  </defs>

  <g id="b-art">
    <!-- 立方体: R/B にずらした複製を重ねて色収差をつくる -->
    <g fill="none" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
      <g stroke="#FF2E97" transform="translate(-1.8 0)" opacity=".9">
        <polygon points="26,5 42,14 42,30 26,39 10,30 10,14"/>
        <path d="M10 14 L26 23 L42 14 M26 23 L26 39"/>
      </g>
      <g stroke="#00F0FF" transform="translate(1.8 0)" opacity=".9">
        <polygon points="26,5 42,14 42,30 26,39 10,30 10,14"/>
        <path d="M10 14 L26 23 L42 14 M26 23 L26 39"/>
      </g>
      <g stroke="#FFFFFF" stroke-width="1.5">
        <polygon points="26,5 42,14 42,30 26,39 10,30 10,14"/>
        <path d="M10 14 L26 23 L42 14 M26 23 L26 39"/>
      </g>
    </g>

    <!-- ワードマーク: 同じく3層 -->
    <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif"
       font-size="21" font-weight="800" letter-spacing="1.4">
      <text x="54" y="28" fill="#FF2E97" opacity=".9" transform="translate(-1.8 0)">EC-CUBE<tspan dx="9" font-size="15" font-weight="700" letter-spacing="3.8">SHOP</tspan></text>
      <text x="54" y="28" fill="#00F0FF" opacity=".9" transform="translate(1.8 0)">EC-CUBE<tspan dx="9" font-size="15" font-weight="700" letter-spacing="3.8">SHOP</tspan></text>
      <text x="54" y="28" fill="#FFFFFF">EC-CUBE<tspan dx="9" font-size="15" font-weight="700" letter-spacing="3.8">SHOP</tspan></text>
      <!-- 信号が飛んだ帯 -->
      <g clip-path="url(#b-slice)"><text x="54" y="28" fill="#00F0FF" transform="translate(6 0)">EC-CUBE<tspan dx="9" font-size="15" font-weight="700" letter-spacing="3.8">SHOP</tspan></text></g>
      <g clip-path="url(#b-slice2)"><text x="54" y="28" fill="#FF2E97" transform="translate(-5 0)">EC-CUBE<tspan dx="9" font-size="15" font-weight="700" letter-spacing="3.8">SHOP</tspan></text></g>
    </g>
  </g>

  <rect x="0" y="0" width="236" height="44" fill="url(#b-scan)"/>
</svg>
