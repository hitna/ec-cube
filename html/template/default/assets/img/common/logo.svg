<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 44" width="236" height="44" role="img" aria-label="EC-CUBE SHOP">
  <title>EC-CUBE SHOP</title>
  <defs>
    <!-- 立方体のエッジ(発光するワイヤーフレーム) -->
    <linearGradient id="lg-edge" x1="10" y1="5" x2="42" y2="39" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7DF9FF"/>
      <stop offset=".5" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#C084FC"/>
    </linearGradient>
    <!-- 各面。上面だけ明るく, 側面は半透明にしてホログラム風に見せる -->
    <linearGradient id="lg-top" x1="10" y1="5" x2="42" y2="23" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#67E8F9" stop-opacity=".95"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity=".75"/>
    </linearGradient>
    <linearGradient id="lg-left" x1="10" y1="14" x2="26" y2="39" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22D3EE" stop-opacity=".40"/>
      <stop offset="1" stop-color="#0EA5E9" stop-opacity=".10"/>
    </linearGradient>
    <linearGradient id="lg-right" x1="42" y1="14" x2="26" y2="39" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A855F7" stop-opacity=".48"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity=".12"/>
    </linearGradient>
    <!-- ワードマーク -->
    <linearGradient id="lg-word" x1="56" y1="8" x2="200" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".6" stop-color="#A5F3FC"/>
      <stop offset="1" stop-color="#67E8F9"/>
    </linearGradient>
    <!-- 文字下のライン(右に向かってフェードアウト) -->
    <linearGradient id="lg-rule" x1="56" y1="0" x2="232" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22D3EE" stop-opacity=".95"/>
      <stop offset=".7" stop-color="#A855F7" stop-opacity=".55"/>
      <stop offset="1" stop-color="#A855F7" stop-opacity="0"/>
    </linearGradient>
    <filter id="fx-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- シンボル: アイソメトリックな立方体をワイヤーフレーム化したもの -->
  <g filter="url(#fx-glow)">
    <polygon points="26,5 42,14 26,23 10,14" fill="url(#lg-top)"/>
    <polygon points="10,14 26,23 26,39 10,30" fill="url(#lg-left)"/>
    <polygon points="42,14 26,23 26,39 42,30" fill="url(#lg-right)"/>
    <g fill="none" stroke="url(#lg-edge)" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round">
      <polygon points="26,5 42,14 42,30 26,39 10,30 10,14"/>
      <path d="M10 14 L26 23 L42 14 M26 23 L26 39"/>
    </g>
    <!-- 頂点のノードと中心のコア -->
    <g fill="#E0F2FE">
      <circle cx="26" cy="5" r="1.3"/>
      <circle cx="42" cy="14" r="1.3"/>
      <circle cx="10" cy="14" r="1.3"/>
      <circle cx="42" cy="30" r="1.3"/>
      <circle cx="10" cy="30" r="1.3"/>
      <circle cx="26" cy="39" r="1.3"/>
    </g>
    <circle cx="26" cy="23" r="2.2" fill="#FFFFFF"/>
  </g>

  <!-- ワードマーク -->
  <text x="56" y="27"
        font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="21" font-weight="800" letter-spacing="1.6">
    <tspan fill="url(#lg-word)">EC-CUBE</tspan><tspan dx="9" font-size="15" font-weight="600" letter-spacing="4.2" fill="#C084FC">SHOP</tspan>
  </text>

  <!-- 回路風のライン -->
  <path d="M56 35 H232" stroke="url(#lg-rule)" stroke-width="1.4" stroke-linecap="round"/>
  <rect x="56" y="33" width="4" height="4" rx="1" fill="#22D3EE"/>
  <rect x="118" y="33.5" width="3" height="3" rx="1" fill="#67E8F9" opacity=".8"/>
</svg>
