<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 44" width="240" height="44" role="img" aria-label="EC-CUBE SHOP">
  <title>EC-CUBE SHOP</title>
  <defs>
    <linearGradient id="f-face" x1="15" y1="10" x2="39" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8AE9FF"/>
      <stop offset="1" stop-color="#2B7FE0"/>
    </linearGradient>
    <linearGradient id="f-face2" x1="15" y1="17" x2="39" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1E88C7" stop-opacity=".55"/>
      <stop offset="1" stop-color="#123A66" stop-opacity=".55"/>
    </linearGradient>
  </defs>

  <!-- 照準を思わせる HUD フレーム -->
  <g stroke="#22D3EE" fill="none">
    <polygon points="27,3 43.4,12.5 43.4,31.5 27,41 10.6,31.5 10.6,12.5"
             stroke-width=".9" stroke-dasharray="7 4.5" opacity=".55"/>
    <g stroke-width="1.2" stroke-linecap="square" opacity=".85">
      <path d="M4 10 V4 H10"/>
      <path d="M50 10 V4 H44"/>
      <path d="M4 34 V40 H10"/>
      <path d="M50 34 V40 H44"/>
    </g>
  </g>

  <!-- 中央の立方体 -->
  <g>
    <polygon points="27,10 39,17 27,24 15,17" fill="url(#f-face)"/>
    <polygon points="15,17 27,24 27,34 15,27" fill="url(#f-face2)"/>
    <polygon points="39,17 27,24 27,34 39,27" fill="#0E2A4A" fill-opacity=".65"/>
    <g fill="none" stroke="#BDF0FF" stroke-width=".85" stroke-linejoin="round">
      <polygon points="27,10 39,17 39,27 27,34 15,27 15,17"/>
      <path d="M15 17 L27 24 L39 17 M27 24 L27 34"/>
    </g>
  </g>

  <!-- ワードマーク -->
  <text x="62" y="27"
        font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="20" font-weight="700" letter-spacing="1.4" fill="#EAF6FF">EC-CUBE</text>

  <!-- 計器のラベルのように囲った SHOP -->
  <rect x="170" y="12.5" width="56" height="16" rx="2" fill="none" stroke="#22D3EE" stroke-width=".9" opacity=".8"/>
  <text x="177.5" y="24.5"
        font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="11" font-weight="700" letter-spacing="3.2" fill="#22D3EE">SHOP</text>

  <!-- 目盛り -->
  <path d="M62 34.5 H226" stroke="#22D3EE" stroke-width="2.6" stroke-dasharray="1 7" opacity=".45" stroke-linecap="butt"/>
</svg>
